name: DainPay Android Release

on:
  push:
    branches: [ main, master, rebuild-from-3a83-firebase-fixed, 90-percent-stable, repair-v74-controlled-4, icon-dainpay-v75, repair-v76-activation-delete ]
  pull_request:
    branches: [ main, master, rebuild-from-3a83-firebase-fixed ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true
      - name: Preserve Firebase configuration
        run: |
          test -f android/app/google-services.json
          cp android/app/google-services.json /tmp/google-services.json
      - name: Reconstruct Android platform with the registered Firebase package
        run: |
          rm -rf android
          flutter create . --project-name=dainpay --platforms=android --org=com.adreemk
          mkdir -p android/app
          cp /tmp/google-services.json android/app/google-services.json
          rm -f test/widget_test.dart
      - name: Apply approved DainPay launcher icon
        run: |
          mkdir -p android/app/src/main/res/drawable-nodpi
          base64 -d assets/icon_source/dainpay_icon.jpg.b64 > android/app/src/main/res/drawable-nodpi/dainpay_icon.jpg
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          text = text.replace('android:icon="@mipmap/ic_launcher"', 'android:icon="@drawable/dainpay_icon"')
          manifest.write_text(text)
          PY
      - name: Configure Android SDK and Firebase Gradle plugin
        run: |
          python3 - <<'PY'
          from pathlib import Path
          settings = Path('android/settings.gradle')
          text = settings.read_text()
          if 'com.google.gms.google-services' not in text:
              text = text.replace('plugins {', 'plugins {\n    id "com.google.gms.google-services" version "4.4.2" apply false', 1)
          settings.write_text(text)
          app = Path('android/app/build.gradle')
          text = app.read_text()
          if 'id "com.google.gms.google-services"' not in text:
              text = text.replace('plugins {', 'plugins {\n    id "com.google.gms.google-services"', 1)
          text = text.replace('flutter.minSdkVersion', '23')
          app.write_text(text)
          PY
      - name: Install dependencies
        run: flutter pub get
      - name: Apply encrypted Google Drive backup integration
        run: |
          python3 tool/add_drive_backup.py
          dart format lib/main.dart lib/backup_service.dart
      - name: Apply v76e activation and customer deletion fixes
        run: |
          python3 tool/fix_v76e_activation_delete.py
          dart format lib/main.dart
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/main.dart firestore.rules
          git diff --cached --quiet || git commit -m "Fix activation codes and zero-balance customer deletion [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}
      - name: Verify Firebase configuration
        run: |
          test -f android/app/google-services.json
          grep -q 'com.adreemk.dainpay' android/app/google-services.json
      - name: Add required Android permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          permissions = ['android.permission.INTERNET','android.permission.RECORD_AUDIO','android.permission.MODIFY_AUDIO_SETTINGS']
          insert = ''.join(f'    <uses-permission android:name="{p}"/>\n' for p in permissions)
          if 'android.permission.INTERNET' not in text:
              end = text.find('>')
              text = text[:end + 1] + '\n' + insert + text[end + 1:]
          manifest.write_text(text)
          PY
      - name: Analyze code
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Build release APK
        run: flutter build apk --release
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dainpay-v76-activation-delete-release
          path: build/app/outputs/flutter-apk/app-release.apk
