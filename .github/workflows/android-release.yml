name: DainPay Android Release
# Final release validation trigger

on:
  push:
    branches: [ main, master, rebuild-from-3a83-firebase-fixed, 90-percent-stable, repair-v74-controlled-4, icon-dainpay-v75, repair-v76-activation-delete, repair-v77-customer-delete, repair-v77b-customer-delete, repair-v78-delete-cloud-fix, repair-v79-google-only-storage, repair-v84-all-screenshot-issues, repair-v86-all-screenshot-fixes ]
  pull_request:
    branches: [ main, master, rebuild-from-3a83-firebase-fixed, repair-v74-controlled-4 ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true
      - name: Preserve Firebase configuration
        run: |
          test -f android/app/google-services.json
          cp android/app/google-services.json /tmp/google-services.json
      - name: Reconstruct Android platform with the registered Firebase package
        run: |
          rm -rf android
          flutter create . --project-name=dainpay --platforms=android --org=com.adreemk
          mkdir -p android/app
          cp /tmp/google-services.json android/app/google-services.json
          rm -f test/widget_test.dart
      - name: Apply approved DainPay launcher icon
        run: |
          mkdir -p android/app/src/main/res/drawable-nodpi
          base64 -d assets/icon_source/dainpay_icon.jpg.b64 > android/app/src/main/res/drawable-nodpi/dainpay_icon.jpg
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          text = text.replace('android:icon="@mipmap/ic_launcher"', 'android:icon="@drawable/dainpay_icon"')
          manifest.write_text(text)
          PY
      - name: Configure Android SDK and Firebase Gradle plugin
        run: |
          python3 - <<'PY'
          from pathlib import Path
          settings = Path('android/settings.gradle')
          text = settings.read_text()
          if 'com.google.gms.google-services' not in text:
              text = text.replace('plugins {', 'plugins {\n    id "com.google.gms.google-services" version "4.4.2" apply false', 1)
          settings.write_text(text)
          app = Path('android/app/build.gradle')
          text = app.read_text()
          if 'id "com.google.gms.google-services"' not in text:
              text = text.replace('plugins {', 'plugins {\n    id "com.google.gms.google-services"', 1)
          text = text.replace('flutter.minSdkVersion', '23')
          text = text.replace('flutter.compileSdkVersion', '35')
          text = text.replace('flutter.targetSdkVersion', '35')
          app.write_text(text)
          PY
      - name: Install dependencies
        run: flutter pub get
      - name: Verify Firebase configuration
        run: |
          test -f android/app/google-services.json
          grep -q 'com.adreemk.dainpay' android/app/google-services.json

      - name: Deploy Firestore rules when Firebase CI credentials are configured
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -n "$FIREBASE_TOKEN" ]; then
            npx --yes firebase-tools deploy --only firestore:rules,functions --project dainpay-a29fc --token "$FIREBASE_TOKEN"
          else
            echo "FIREBASE_TOKEN is not configured; skipping live Firestore rules deployment."
          fi

      - name: Add required Android speech permissions and recognition query
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()

          permissions = [
              'android.permission.INTERNET',
              'android.permission.RECORD_AUDIO',
              'android.permission.MODIFY_AUDIO_SETTINGS',
          ]

          manifest_end = text.find('>')
          if manifest_end < 0:
              raise SystemExit('Invalid AndroidManifest.xml')

          header = text[:manifest_end + 1]
          body = text[manifest_end + 1:]

          for permission in permissions:
              if f'android:name="{permission}"' not in text:
                  header += f'\n    <uses-permission android:name="{permission}"/>'
          text = header + body

          if 'android.speech.RecognitionService' not in text:
              marker = '    <queries>\n        <intent>\n            <action android:name="android.speech.RecognitionService" />\n        </intent>\n    </queries>\n'
              app_index = text.find('    <application')
              if app_index < 0:
                  raise SystemExit('Android application tag not found')
              text = text[:app_index] + marker + text[app_index:]

          manifest.write_text(text)
          PY
      - name: Verify Android speech configuration
        run: |
          grep -q 'android.permission.RECORD_AUDIO' android/app/src/main/AndroidManifest.xml
          grep -q 'android.speech.RecognitionService' android/app/src/main/AndroidManifest.xml
      - name: Verify DainPay screenshot fixes
        run: |
          grep -q "speech_to_text: 6.6.2" pubspec.yaml
          grep -q "androidNoBluetooth" lib/main.dart
          grep -q "androidIntentLookup" lib/main.dart
          ! grep -q "رمز الاسترداد" lib/main.dart
      - name: Analyze code
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Build release APK
        run: flutter build apk --release
      - name: Record release signing certificate
        run: |
          find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1 | xargs -I{} {} verify --print-certs build/app/outputs/flutter-apk/app-release.apk > release-signing-certificate.txt || true
          cat release-signing-certificate.txt
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dainpay-v86-all-screenshot-fixes-release
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            release-signing-certificate.txt
