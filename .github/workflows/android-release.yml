name: DainPay Android Release

on:
  push:
    branches: [ main, v82-unified-repair, v83-voice-copy, v84-voice-timeout-diagnostics ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: dainpay-release-v2-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true

      - name: Preserve Firebase configuration
        run: |
          test -f android/app/google-services.json
          cp android/app/google-services.json /tmp/google-services.json

      - name: Reconstruct Android platform with the registered Firebase package
        run: |
          rm -rf android
          flutter create . --project-name=dainpay --platforms=android --org=com.adreemk
          mkdir -p android/app
          cp /tmp/google-services.json android/app/google-services.json
          rm -f test/widget_test.dart

      - name: Remove the redundant native launcher logo before welcome screen
        run: |
          python3 - <<'PY'
          from pathlib import Path

          res = Path('android/app/src/main/res')
          drawable = res / 'drawable'
          drawable.mkdir(parents=True, exist_ok=True)
          (drawable / 'splash_transparent.xml').write_text('''<?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#00101719" />
          </shape>
          ''')

          # Android 12+ renders the app icon on the native splash unless the
          # animated icon is explicitly overridden. Keep only a matching,
          # unobtrusive background while Flutter starts.
          for styles in res.glob('values-v31/styles.xml'):
              text = styles.read_text()
              import re
              text = re.sub(
                  r'(<item name="android:windowSplashScreenAnimatedIcon">).*?(</item>)',
                  r'\\1@drawable/splash_transparent\\2',
                  text,
              )
              text = re.sub(
                  r'(<item name="android:windowSplashScreenBackground">).*?(</item>)',
                  r'\\1#101719\\2',
                  text,
              )
              styles.write_text(text)
          PY

      - name: Apply approved DainPay launcher icon
        run: |
          mkdir -p android/app/src/main/res/drawable-nodpi
          base64 -d assets/icon_source/dainpay_icon.jpg.b64 > android/app/src/main/res/drawable-nodpi/dainpay_icon.jpg
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          text = text.replace('android:icon="@mipmap/ic_launcher"', 'android:icon="@drawable/dainpay_icon"')
          if 'android:label="dainpay"' not in text:
              raise SystemExit('Generated Android app label was not the expected value')
          text = text.replace('android:label="dainpay"', 'android:label="دفتر الديون"', 1)
          manifest.write_text(text)
          PY

      - name: Configure Android SDK and Firebase Gradle plugin
        run: |
          python3 - <<'PY'
          from pathlib import Path

          settings_kts = Path('android/settings.gradle.kts')
          settings_groovy = Path('android/settings.gradle')
          settings = settings_kts if settings_kts.exists() else settings_groovy
          if not settings.exists():
              raise SystemExit('Flutter settings.gradle(.kts) was not generated')
          text = settings.read_text()
          if 'com.google.gms.google-services' not in text:
              plugin = ('    id("com.google.gms.google-services") version "4.4.2" apply false'
                        if settings.suffix == '.kts'
                        else '    id "com.google.gms.google-services" version "4.4.2" apply false')
              text = text.replace('plugins {', 'plugins {' + chr(10) + plugin, 1)
          settings.write_text(text)

          app_kts = Path('android/app/build.gradle.kts')
          app_groovy = Path('android/app/build.gradle')
          app = app_kts if app_kts.exists() else app_groovy
          if not app.exists():
              raise SystemExit('Flutter app build.gradle(.kts) was not generated')
          text = app.read_text()
          if 'com.google.gms.google-services' not in text:
              plugin = ('    id("com.google.gms.google-services")'
                        if app.suffix == '.kts'
                        else '    id "com.google.gms.google-services"')
              text = text.replace('plugins {', 'plugins {' + chr(10) + plugin, 1)
          text = text.replace('flutter.minSdkVersion', '23')
          text = text.replace('flutter.compileSdkVersion', '36')
          text = text.replace('flutter.targetSdkVersion', '35')
          app.write_text(text)
          PY

      # Release signing is configured only for trusted push/manual runs.
      # Pull requests can still compile without access to repository secrets.
      - name: Decode release keystore
        if: github.event_name != 'pull_request'
        env:
          DAINPAY_KEYSTORE_BASE64: ${{ secrets.DAINPAY_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$DAINPAY_KEYSTORE_BASE64" || { echo "Missing DAINPAY_KEYSTORE_BASE64 secret"; exit 1; }
          mkdir -p "$RUNNER_TEMP/dainpay-signing"
          printf '%s' "$DAINPAY_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/dainpay-signing/dainpay-release.jks"
          test -s "$RUNNER_TEMP/dainpay-signing/dainpay-release.jks"
          echo "DAINPAY_KEYSTORE_PATH=$RUNNER_TEMP/dainpay-signing/dainpay-release.jks" >> "$GITHUB_ENV"

      - name: Configure release signing in generated Gradle file
        if: github.event_name != 'pull_request'
        run: |
          python3 - <<'PY'
          from pathlib import Path

          kts = Path('android/app/build.gradle.kts')
          groovy = Path('android/app/build.gradle')
          app = kts if kts.exists() else groovy
          if not app.exists():
              raise SystemExit('Generated app Gradle file not found')

          text = app.read_text()
          if 'signingConfigs' in text and 'dainpayReleaseSigning' in text:
              raise SystemExit('Release signing patch appears to have already been applied')

          if app.suffix == '.kts':
              signing = '''
              // DainPay permanent release key; credentials are read from GitHub Actions environment.
              signingConfigs {
                  create("dainpayReleaseSigning") {
                      storeFile = file(System.getenv("DAINPAY_KEYSTORE_PATH"))
                      storePassword = System.getenv("DAINPAY_STORE_PASSWORD")
                      keyAlias = System.getenv("DAINPAY_KEY_ALIAS")
                      keyPassword = System.getenv("DAINPAY_KEY_PASSWORD")
                  }
              }
          '''
              old_release = 'signingConfig = signingConfigs.getByName("debug")'
              new_release = 'signingConfig = signingConfigs.getByName("dainpayReleaseSigning")'
              if old_release not in text:
                  raise SystemExit('Could not find default release signingConfig in build.gradle.kts')
              text = text.replace(old_release, new_release, 1)
          else:
              signing = '''
              // DainPay permanent release key; credentials are read from GitHub Actions environment.
              signingConfigs {
                  dainpayReleaseSigning {
                      storeFile file(System.getenv("DAINPAY_KEYSTORE_PATH"))
                      storePassword System.getenv("DAINPAY_STORE_PASSWORD")
                      keyAlias System.getenv("DAINPAY_KEY_ALIAS")
                      keyPassword System.getenv("DAINPAY_KEY_PASSWORD")
                  }
              }
          '''
              old_release = 'signingConfig signingConfigs.debug'
              new_release = 'signingConfig signingConfigs.dainpayReleaseSigning'
              if old_release not in text:
                  raise SystemExit('Could not find default release signingConfig in build.gradle')
              text = text.replace(old_release, new_release, 1)

          marker = 'android {'
          if marker not in text:
              raise SystemExit('Could not find android block in app Gradle file')
          text = text.replace(marker, marker + signing, 1)
          app.write_text(text)
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Verify Firebase configuration
        run: |
          test -f android/app/google-services.json
          grep -q 'com.adreemk.dainpay' android/app/google-services.json

      - name: Deploy Firestore rules when Firebase CI credentials are configured
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -n "$FIREBASE_TOKEN" ]; then
            npx --yes firebase-tools deploy --only firestore:rules,functions --project dainpay-a29fc --token "$FIREBASE_TOKEN"
          else
            echo "FIREBASE_TOKEN is not configured; skipping live Firestore rules deployment."
          fi

      - name: Add required Android speech permissions and recognition query
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()

          permissions = [
              'android.permission.INTERNET',
              'android.permission.RECORD_AUDIO',
              'android.permission.MODIFY_AUDIO_SETTINGS',
          ]

          manifest_end = text.find('>')
          if manifest_end < 0:
              raise SystemExit('Invalid AndroidManifest.xml')

          header = text[:manifest_end + 1]
          body = text[manifest_end + 1:]

          for permission in permissions:
              if f'android:name="{permission}"' not in text:
                  header += f'\n    <uses-permission android:name="{permission}"/>'
          text = header + body

          if 'android.speech.RecognitionService' not in text:
              marker = '    <queries>\n        <intent>\n            <action android:name="android.speech.RecognitionService" />\n        </intent>\n    </queries>\n'
              app_index = text.find('    <application')
              if app_index < 0:
                  raise SystemExit('Android application tag not found')
              text = text[:app_index] + marker + text[app_index:]

          manifest.write_text(text)
          PY

      - name: Verify Android speech configuration
        run: |
          grep -q 'android.permission.RECORD_AUDIO' android/app/src/main/AndroidManifest.xml
          grep -q 'android.speech.RecognitionService' android/app/src/main/AndroidManifest.xml

      - name: Verify DainPay screenshot fixes
        run: |
          grep -q "speech_to_text:" pubspec.yaml
          grep -q "android.permission.RECORD_AUDIO" android/app/src/main/AndroidManifest.xml
          grep -q "android.speech.RecognitionService" android/app/src/main/AndroidManifest.xml
          ! grep -q "رمز الاسترداد" lib/main.dart
          ! grep -q "backup_recovery_code" lib/main.dart

      - name: Analyze code
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Build release APK
        env:
          DAINPAY_STORE_PASSWORD: ${{ secrets.DAINPAY_STORE_PASSWORD }}
          DAINPAY_KEY_PASSWORD: ${{ secrets.DAINPAY_KEY_PASSWORD }}
          DAINPAY_KEY_ALIAS: ${{ secrets.DAINPAY_KEY_ALIAS }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            test -n "$DAINPAY_STORE_PASSWORD" || { echo "Missing DAINPAY_STORE_PASSWORD secret"; exit 1; }
            test -n "$DAINPAY_KEY_PASSWORD" || { echo "Missing DAINPAY_KEY_PASSWORD secret"; exit 1; }
            test -n "$DAINPAY_KEY_ALIAS" || { echo "Missing DAINPAY_KEY_ALIAS secret"; exit 1; }
          fi
          flutter build apk --release

      - name: Record release signing certificate
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --print-certs "$APK" | tee release-signing-certificate.txt
          test -s release-signing-certificate.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dainpay-v84-voice-timeout-diagnostics-release
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            release-signing-certificate.txt
