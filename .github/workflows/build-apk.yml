name: Build DainPay APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: Generate Android platform
        run: flutter create . --platforms=android --org com.adreemk --project-name dainpay

      - name: Install Firebase Android configuration
        run: |
          test -f android/app/google-services.json
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/settings.gradle")
          s = p.read_text()
          marker = 'id "org.jetbrains.kotlin.android" version'
          lines = s.splitlines()
          if not any("com.google.gms.google-services" in x for x in lines):
              idx = next(i for i,x in enumerate(lines) if marker in x)
              lines.insert(idx + 1, '    id "com.google.gms.google-services" version "4.5.0" apply false')
          p.write_text("\n".join(lines) + "\n")
          p = Path("android/app/build.gradle")
          s = p.read_text()
          if 'id "com.google.gms.google-services"' not in s:
              s = s.replace('id "dev.flutter.flutter-gradle-plugin"', 'id "dev.flutter.flutter-gradle-plugin"\n    id "com.google.gms.google-services"')
          p.write_text(s)
          PY

      - name: Set Android minimum SDK for Firebase
        run: sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' android/app/build.gradle

      - name: Fix generated Dart const issue
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("lib/main.dart")
          s = p.read_text()
          s = s.replace("subtitle: const Text(\\n                  store.firebaseReady", "subtitle: Text(\\n                  store.firebaseReady")
          p.write_text(s)
          PY

      - name: Fix Dart const compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("lib/main.dart")
          s = p.read_text()
          s = s.replace("subtitle: const Text(", "subtitle: Text(")
          p.write_text(s)
          PY

      - name: Apply DainPay functional fixes
        run: python3 tool/fix_release.py

      - name: Apply 10-day trial and hidden Adreemk owner panel
        run: python3 tool/owner_trial_patch.py

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze lib --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DainPay-Firebase-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
