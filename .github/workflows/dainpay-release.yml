name: DainPay Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: Generate Android host project
        shell: bash
        run: |
          cp android/app/google-services.json /tmp/google-services.json
          flutter create . --platforms=android --org com.adreemk --project-name dainpay
          mkdir -p android/app
          cp /tmp/google-services.json android/app/google-services.json

      - name: Configure Firebase Android plugin
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/settings.gradle')
          if p.exists():
              s = p.read_text()
              needle = 'id "org.jetbrains.kotlin.android" version "1.8.22" apply false'
              if needle in s and 'com.google.gms.google-services' not in s:
                  s = s.replace(needle, needle + '\n    id "com.google.gms.google-services" version "4.4.2" apply false')
              p.write_text(s)
          p = Path('android/settings.gradle.kts')
          if p.exists():
              s = p.read_text()
              needle = 'id("org.jetbrains.kotlin.android") version "1.9.22" apply false'
              if needle in s and 'com.google.gms.google-services' not in s:
                  s = s.replace(needle, needle + '\n    id("com.google.gms.google-services") version "4.4.2" apply false')
              p.write_text(s)
          for name in ['android/app/build.gradle','android/app/build.gradle.kts']:
              p = Path(name)
              if p.exists():
                  s = p.read_text()
                  if 'com.google.gms.google-services' not in s:
                      if 'plugins {' in s:
                          if name.endswith('.kts'):
                              s = s.replace('plugins {', 'plugins {\n    id("com.google.gms.google-services")', 1)
                          else:
                              s = s.replace('plugins {', 'plugins {\n    id "com.google.gms.google-services"', 1)
                  p.write_text(s)
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze lib --no-fatal-infos --no-fatal-warnings

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: DainPay-Release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
