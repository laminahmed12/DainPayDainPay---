name: DainPay v74 Fixed Controlled Repair

on:
  pull_request:
    types: [opened, synchronize]
    branches: [ main ]

permissions:
  contents: write

jobs:
  repair-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true
      - name: Preserve Firebase configuration
        run: cp android/app/google-services.json /tmp/google-services.json
      - name: Validate repair script syntax
        run: python3 -m py_compile tool/repair_v74_controlled.py
      - name: Apply controlled repair
        run: python3 tool/repair_v74_controlled.py
      - name: Reconstruct Android
        run: |
          rm -rf android
          flutter create . --project-name=dainpay --platforms=android --org=com.adreemk
          mkdir -p android/app
          cp /tmp/google-services.json android/app/google-services.json
          rm -f test/widget_test.dart
      - name: Configure Firebase Gradle plugin
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/settings.gradle'); s=p.read_text()
          if 'com.google.gms.google-services' not in s:
              s=s.replace('plugins {','plugins {\n    id "com.google.gms.google-services" version "4.4.2" apply false',1)
          p.write_text(s)
          p=Path('android/app/build.gradle'); s=p.read_text()
          if 'id "com.google.gms.google-services"' not in s:
              s=s.replace('plugins {','plugins {\n    id "com.google.gms.google-services"',1)
          p.write_text(s.replace('flutter.minSdkVersion','23'))
          PY
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Build Release APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: dainpay-v74-fixed-controlled-release
          path: build/app/outputs/flutter-apk/app-release.apk

# Validation branch only; do not merge until the APK passes the requested tests.
