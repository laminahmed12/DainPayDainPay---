name: DainPay v74 Controlled Validation

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dainpay-v74-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true
      - name: Validate repair script syntax
        run: python3 -m py_compile tool/repair_v74_controlled.py
      - name: Validate controlled repair script
        run: python3 tool/repair_v74_controlled.py
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos
      - name: Run regression tests
        run: flutter test

# Android platform reconstruction and APK creation are performed only by android-release.yml.
# This workflow does not modify production Firebase or Cloudflare services.
