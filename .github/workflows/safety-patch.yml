name: Apply DainPay safety patch
on:
  push:
    branches: [main]
    paths:
      - 'lib/main.dart'
      - 'pubspec.yaml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[safety-patch]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/main.dart')
          s=p.read_text(encoding='utf-8')
          s=s.replace("  bool isAdmin = false;\n\n  bool _disposed", "  bool isAdmin = false;\n  Timer? _onlineProbeTimer;\n\n  bool _disposed")
          s=s.replace("    _disposed = true;\n    super.dispose();", "    _disposed = true;\n    _onlineProbeTimer?.cancel();\n    super.dispose();")
          anchor="  Future<void> loadActivation() => loadAccountState();\n"
          addition='''

  Future<bool> probeInternet() async {
    if (!firebaseInitialized || uid.isEmpty) { firebaseReady=false; safeNotify(); return false; }
    try {
      await userRef.doc(uid).get(const GetOptions(source: Source.server)).timeout(const Duration(seconds: 6));
      if (!firebaseReady) { firebaseReady=true; safeNotify(); }
      return true;
    } catch (_) {
      if (firebaseReady) { firebaseReady=false; safeNotify(); }
      return false;
    }
  }

  void startOnlineMonitor() {
    _onlineProbeTimer?.cancel();
    _onlineProbeTimer=Timer.periodic(const Duration(seconds: 12), (_) async { await probeInternet(); });
  }

  Future<void> signInPermanent(String email, String password) async {
    final credential=await FirebaseAuth.instance.signInWithEmailAndPassword(email:email.trim(),password:password);
    final user=credential.user;
    if(user==null) throw FirebaseAuthException(code:'no-user');
    uid=user.uid;
    firebaseReady=await probeInternet();
    if(!firebaseReady) throw FirebaseException(plugin:'cloud_firestore',code:'offline');
    await loadAccountState();
    await pullCloud();
    await saveLocal();
    safeNotify();
  }

  Future<void> secureCurrentAccount(String email, String password) async {
    final user=FirebaseAuth.instance.currentUser;
    if(user==null) throw FirebaseAuthException(code:'no-user');
    if(!user.isAnonymous) throw FirebaseAuthException(code:'already-permanent');
    final credential=EmailAuthProvider.credential(email:email.trim(),password:password);
    await user.linkWithCredential(credential);
    uid=FirebaseAuth.instance.currentUser?.uid ?? user.uid;
    await userRef.doc(uid).set({'accountSecured':true,'accountEmail':email.trim(),'deviceId':deviceId,'trialStart':trialStart==null?FieldValue.serverTimestamp():Timestamp.fromDate(trialStart!)},SetOptions(merge:true));
    await syncAll();
    safeNotify();
  }
'''
          if addition.strip() not in s: s=s.replace(anchor,anchor+addition)
          s=s.replace("      await pullCloud();\n\n      safeNotify();", "      await pullCloud();\n      await probeInternet();\n      startOnlineMonitor();\n\n      safeNotify();",1)
          anchor2="  String risk(String customerId) {"
          delete_method='''
  Future<bool> deleteCustomer(Customer customer) async {
    if (balance(customer.id) != 0 || !firebaseReady || uid.isEmpty) return false;
    try {
      final server=await transactionRef.get(const GetOptions(source: Source.server)).timeout(const Duration(seconds:8));
      var serverBalance=0;
      for(final doc in server.docs){final data=doc.data();if('${data['customerId']??''}'!=customer.id)continue;final amount=data['amountCents'] is num?(data['amountCents'] as num).toInt():0;serverBalance+=data['type']=='debt'?amount:-amount;}
      if(serverBalance!=0)return false;
      await customerRef.doc(customer.id).delete();
      final ids=transactions.where((t)=>t.customerId==customer.id).map((t)=>t.id).toList();
      for(final id in ids){await transactionRef.doc(id).delete();}
      customers.removeWhere((c)=>c.id==customer.id); transactions.removeWhere((t)=>t.customerId==customer.id);
      await saveLocal(); safeNotify(); return true;
    }catch(e){debugPrint('Protected delete error: $e');return false;}
  }

'''
          if delete_method.strip() not in s: s=s.replace(anchor2,delete_method+anchor2)
          marker="  Future<void> openWhatsApp(BuildContext context) async {"
          dm='''
  Future<void> deleteCustomer(BuildContext context) async {
    final balance=store.balance(customer.id);
    if(balance!=0){ScaffoldMessenger.of(context).showSnackBar(SnackBar(content:Text('لا يمكن حذف الزبون. المتبقي عليه ${money(balance)}')));return;}
    final confirm=await showDialog<bool>(context:context,builder:(_)=>AlertDialog(title:const Text('حذف الزبون'),content:const Text('الرصيد صفر. هل تريد حذف الزبون نهائيًا؟'),actions:[TextButton(onPressed:()=>Navigator.pop(context,false),child:const Text('إلغاء')),FilledButton(onPressed:()=>Navigator.pop(context,true),child:const Text('حذف'))]));
    if(confirm!=true)return; final ok=await store.deleteCustomer(customer); if(!context.mounted)return;
    ScaffoldMessenger.of(context).showSnackBar(SnackBar(content:Text(ok?'تم حذف الزبون':'تعذر الحذف. يجب التأكد من أن الرصيد صفر والاتصال متاح.'))); if(ok)Navigator.pop(context);
  }

'''
          if dm.strip() not in s: s=s.replace(marker,dm+marker,1)
          s=s.replace("appBar: AppBar(title: Text(customer.name)),","appBar: AppBar(title: Text(customer.name),actions:[IconButton(tooltip:'حذف الزبون',onPressed:()=>deleteCustomer(context),icon:const Icon(Icons.delete_outline))]),",1)
          settings_anchor="          OutlinedButton(\n            onPressed: () {\n              Navigator.push(\n                context,\n                MaterialPageRoute(builder: (_) => ActivationPage(store: store)),\n              );\n            },\n            child: const Text('التفعيل'),\n          ),"
          recovery_button="""          OutlinedButton(
            onPressed: () => Navigator.push(context, MaterialPageRoute(builder: (_) => AccountRecoveryPage(store: store))),
            child: const Text('تأمين الحساب / استعادة البيانات'),
          ),
"""
          if recovery_button.strip() not in s: s=s.replace(settings_anchor,recovery_button+settings_anchor)
          recovery_class='''

class AccountRecoveryPage extends StatefulWidget {
  const AccountRecoveryPage({super.key,required this.store}); final Store store;
  @override State<AccountRecoveryPage> createState()=>_AccountRecoveryPageState();
}
class _AccountRecoveryPageState extends State<AccountRecoveryPage>{
  final email=TextEditingController(); final password=TextEditingController(); bool busy=false;
  @override void dispose(){email.dispose();password.dispose();super.dispose();}
  Future<void> secure()async{if(busy)return;if(email.text.trim().isEmpty||password.text.length<6){ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content:Text('أدخل بريدًا صحيحًا وكلمة مرور من 6 أحرف على الأقل')));return;}setState(()=>busy=true);try{await widget.store.secureCurrentAccount(email.text,password.text);if(mounted)ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content:Text('تم تأمين الحساب ويمكن استعادته من هاتف آخر.')));}catch(e){if(mounted)ScaffoldMessenger.of(context).showSnackBar(SnackBar(content:Text('تعذر تأمين الحساب: $e')));}finally{if(mounted)setState(()=>busy=false);}}
  Future<void> restore()async{if(busy)return;setState(()=>busy=true);try{await widget.store.signInPermanent(email.text,password.text);if(mounted)ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content:Text('تم تسجيل الدخول واستعادة البيانات.')));}catch(e){if(mounted)ScaffoldMessenger.of(context).showSnackBar(SnackBar(content:Text('تعذر الاستعادة: $e')));}finally{if(mounted)setState(()=>busy=false);}}
  @override Widget build(BuildContext context)=>Scaffold(appBar:AppBar(title:const Text('تأمين واستعادة البيانات')),body:ListView(padding:const EdgeInsets.all(16),children:[const Card(child:Padding(padding:EdgeInsets.all(16),child:Text('بيانات المحل لا تعتمد على الهاتف بعد تأمين الحساب. استخدم البريد وكلمة المرور نفسها على أي هاتف لاستعادة العملاء والعمليات.'))),TextField(controller:email,keyboardType:TextInputType.emailAddress,decoration:const InputDecoration(labelText:'البريد الإلكتروني')),TextField(controller:password,obscureText:true,decoration:const InputDecoration(labelText:'كلمة المرور')),const SizedBox(height:12),FilledButton(onPressed:busy?null:secure,child:Text(busy?'جارٍ الحفظ...':'تأمين هذا الحساب')),OutlinedButton(onPressed:busy?null:restore,child:const Text('استعادة البيانات من حساب موجود'))]));
}
'''
          if recovery_class.strip() not in s: s=s.replace("class ActivationPage extends StatefulWidget {",recovery_class+"\nclass ActivationPage extends StatefulWidget {",1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name 'DainPay Builder'
          git config user.email 'actions@github.com'
          git add lib/main.dart
          git diff --cached --quiet && exit 0
          git commit -m 'Apply DainPay recovery and safety patch [safety-patch]'
          git push
