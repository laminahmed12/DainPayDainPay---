name: Apply DainPay safety patch
on:
  push:
    branches: [main]
    paths:
      - 'lib/main.dart'
      - 'pubspec.yaml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify runner
        run: echo DainPay safety patch runner is active
