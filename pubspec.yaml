name: dainpay
description: DainPay - دفتر الديون والجمعيات للأفراد والتجار في ليبيا.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2
  firebase_core: ^3.8.0
  cloud_firestore: ^5.5.0
  firebase_storage: ^12.3.6
  firebase_auth: ^5.3.3
  url_launcher: ^6.3.1
  intl: ^0.19.0
  pdf: ^3.11.3
  printing: ^5.13.4
  share_plus: ^10.1.4
  path_provider: ^2.1.4
  image_picker: ^1.1.2
  speech_to_text: ^6.6.2
  file_picker: ^8.1.7
  flutter_local_notifications: ^17.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
